name: Build Starcat DMG

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布版本标签 (例如 v1.6.1-custom)'
        required: false
        default: 'latest-unlocked'
  push:
    branches:
      - main
    paths-ignore:
      - 'README*.md'
      - 'docs/**'
      - 'LICENSE'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package macOS DMG
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 16
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode* || true
          if [ -d /Applications/Xcode_16.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d /Applications/Xcode_16.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d /Applications/Xcode_16.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d /Applications/Xcode_16.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcodebuild -version

      - name: Install dependencies
        run: |
          brew install xcodegen

      - name: Prepare build environment
        run: |
          # 准备 Secrets 配置文件
          if [ ! -f Configs/Secrets.xcconfig ]; then
            cp Configs/Secrets.xcconfig.template Configs/Secrets.xcconfig
          fi

          # 准备 Release 依赖的 Changelog 目录
          mkdir -p supports/starcat-pro
          cp CHANGELOG.md supports/starcat-pro/CHANGELOG.md
          cp CHANGELOG-ZH.md supports/starcat-pro/CHANGELOG-ZH.md

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Resolve SPM Dependencies & Patch swift-sdk
        run: |
          echo "Resolving package dependencies..."
          xcodebuild \
            -resolvePackageDependencies \
            -project Starcat.xcodeproj \
            -scheme StarcatDirect \
            -derivedDataPath build/DerivedData

          echo "Applying Swift 6 compatibility patch to swift-sdk..."
          find build/DerivedData ~/Library/Developer/Xcode/DerivedData ~/Library/Caches/org.swift.swiftpm -name "HTTPClientTransport.swift" 2>/dev/null | while read -r file; do
            echo "Patching $file..."
            sed -i '' 's/withThrowingTaskGroup {/withThrowingTaskGroup(of: Void.self) {/g' "$file"
          done

      - name: Build StarcatDirect
        run: |
          xcodebuild \
            -scheme StarcatDirect \
            -configuration Release \
            -sdk macosx \
            -arch arm64 \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            STARCAT_DISTRIBUTION=direct \
            build

      - name: Sign App with Ad-hoc Identity
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release/Starcat.app"
          echo "Signing app at ${APP_PATH}..."
          codesign --force --deep --sign - "${APP_PATH}"

      - name: Package DMG
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release/Starcat.app"
          mkdir -p dist/staging dist/release
          cp -R "${APP_PATH}" dist/staging/
          ln -s /Applications dist/staging/Applications

          hdiutil create \
            -volname "Starcat" \
            -srcfolder dist/staging \
            -ov \
            -format UDZO \
            dist/release/Starcat-arm64.dmg

          shasum -a 256 dist/release/Starcat-arm64.dmg > dist/release/Starcat-arm64.dmg.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Starcat-arm64-DMG
          path: dist/release/Starcat-arm64.dmg

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.release_tag || format('v1.6.1-unlocked-b{0}', github.run_number) }}
          name: Starcat 解锁版 (自动编译发布)
          body: |
            ## Starcat 自动编译解锁版
            - **包含内容**：全功能解锁（永久 Pro，全量 AI 问答/RAG/语义搜索）
            - **支持架构**：Apple Silicon (arm64)
            - **使用说明**：下载后双击挂载 DMG，将 Starcat 拖入「应用程序」，右键打开即可。
          draft: false
          prerelease: false
          files: |
            dist/release/Starcat-arm64.dmg
            dist/release/Starcat-arm64.dmg.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
